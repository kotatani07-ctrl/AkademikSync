<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;">
  <defs>
    <linearGradient id="genGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="30" y="25" width="940" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="30" y="25" width="940" height="4" rx="2" fill="url(#genGrad)"/>
  <text x="50" y="62" fill="#ffffff" font-size="19" font-weight="700">DIAGRAM ALUR KERJA: GENERATE TRANSKRIP AKADEMIK (SINGLE &amp; BATCH)</text>
  <text x="750" y="60" fill="#94a3b8" font-size="12">Feeder &amp; Matching Engine</text>

  <!-- STEP 1 -->
  <g transform="translate(30, 110)">
    <rect width="210" height="400" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" fill="#38bdf8" font-size="14" font-weight="700">LANGKAH 1</text>
    <text x="20" y="52" fill="#ffffff" font-size="15" font-weight="700">Input Data User</text>

    <rect x="15" y="70" width="180" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="95" fill="#e2e8f0" font-size="12" font-weight="600">Mode Single (NIM)</text>
    <text x="25" y="115" fill="#94a3b8" font-size="10">Ketik 1 NIM pada form</text>
    <text x="25" y="132" fill="#94a3b8" font-size="10">Contoh: 2021010001</text>

    <rect x="15" y="170" width="180" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="195" fill="#e2e8f0" font-size="12" font-weight="600">Mode Batch (File)</text>
    <text x="25" y="215" fill="#94a3b8" font-size="10">Upload berkas:</text>
    <text x="25" y="232" fill="#94a3b8" font-size="10">• File .txt / .csv / .xlsx</text>
    <text x="25" y="249" fill="#94a3b8" font-size="10">• Maks. 100 NIM/batch</text>

    <rect x="15" y="285" width="180" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="310" fill="#e2e8f0" font-size="12" font-weight="600">Validasi Input</text>
    <text x="25" y="330" fill="#94a3b8" font-size="10">Pengecekan sintaks NIM,</text>
    <text x="25" y="347" fill="#94a3b8" font-size="10">eliminasi duplikat, dan</text>
    <text x="25" y="364" fill="#94a3b8" font-size="10">inisiasi BatchJob ID</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(270, 110)">
    <rect width="210" height="400" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" fill="#c084fc" font-size="14" font-weight="700">LANGKAH 2</text>
    <text x="20" y="52" fill="#ffffff" font-size="15" font-weight="700">Tarik Data Feeder</text>

    <rect x="15" y="70" width="180" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="95" fill="#e2e8f0" font-size="12" font-weight="600">Autentikasi Token</text>
    <text x="25" y="115" fill="#94a3b8" font-size="10">GetToken() ke endpoint</text>
    <text x="25" y="132" fill="#94a3b8" font-size="10">ws/live2.php Neo Feeder</text>

    <rect x="15" y="170" width="180" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="195" fill="#e2e8f0" font-size="12" font-weight="600">Get Biodata Mahasiswa</text>
    <text x="25" y="215" fill="#94a3b8" font-size="10">Mengambil data resmi:</text>
    <text x="25" y="232" fill="#94a3b8" font-size="10">• Nama, Prodi, Jenjang</text>
    <text x="25" y="249" fill="#94a3b8" font-size="10">• Tempat / Tanggal Lahir</text>

    <rect x="15" y="285" width="180" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="310" fill="#e2e8f0" font-size="12" font-weight="600">Get Nilai Perkuliahan</text>
    <text x="25" y="330" fill="#94a3b8" font-size="10">Seluruh riwayat MK:</text>
    <text x="25" y="347" fill="#94a3b8" font-size="10">Kode MK, Nama, Nilai</text>
    <text x="25" y="364" fill="#94a3b8" font-size="10">Fallback: DHS Scraping</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(510, 110)">
    <rect width="220" height="400" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" fill="#f472b6" font-size="14" font-weight="700">LANGKAH 3</text>
    <text x="20" y="52" fill="#ffffff" font-size="15" font-weight="700">Matching Kurikulum</text>

    <rect x="15" y="70" width="190" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="95" fill="#e2e8f0" font-size="12" font-weight="600">Lookup Kurikulum</text>
    <text x="25" y="115" fill="#94a3b8" font-size="10">Cocokkan jenjang, prodi,</text>
    <text x="25" y="132" fill="#94a3b8" font-size="10">dan tahun angkatan ke</text>
    <text x="25" y="149" fill="#94a3b8" font-size="10">master Kurikulum &amp; Template</text>

    <rect x="15" y="180" width="190" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="205" fill="#e2e8f0" font-size="12" font-weight="600">Resolusi Nilai Mahasiswa</text>
    <text x="25" y="225" fill="#94a3b8" font-size="10">• Retake: ambil nilai terbaik</text>
    <text x="25" y="242" fill="#94a3b8" font-size="10">• Tandai MK belum diambil</text>
    <text x="25" y="259" fill="#94a3b8" font-size="10">• Hitung Total SKS &amp; Mutu</text>

    <rect x="15" y="295" width="190" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="320" fill="#e2e8f0" font-size="12" font-weight="600">Kalkulasi IPK &amp; Predikat</text>
    <text x="25" y="340" fill="#94a3b8" font-size="10">IPK = Total Bobot / Total SKS</text>
    <text x="25" y="357" fill="#94a3b8" font-size="10">Lookup tabel PredikatKelulusan</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(760, 110)">
    <rect width="210" height="400" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" fill="#34d399" font-size="14" font-weight="700">LANGKAH 4</text>
    <text x="20" y="52" fill="#ffffff" font-size="15" font-weight="700">Generate &amp; Export</text>

    <rect x="15" y="70" width="180" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="95" fill="#e2e8f0" font-size="12" font-weight="600">Buka Template Excel</text>
    <text x="25" y="115" fill="#94a3b8" font-size="10">Baca cell_mapping JSON,</text>
    <text x="25" y="132" fill="#94a3b8" font-size="10">load template transkrip .xlsx</text>

    <rect x="15" y="170" width="180" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="195" fill="#e2e8f0" font-size="12" font-weight="600">Penulisan Nilai &amp; Biodata</text>
    <text x="25" y="215" fill="#94a3b8" font-size="10">Isi cell biodata, isi nilai</text>
    <text x="25" y="232" fill="#94a3b8" font-size="10">MK Halaman 1 &amp; Halaman 2,</text>
    <text x="25" y="249" fill="#94a3b8" font-size="10">judul skripsi, nomor ijazah</text>

    <rect x="15" y="285" width="180" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="310" fill="#e2e8f0" font-size="12" font-weight="600">Unduh Berkas Hasil</text>
    <text x="25" y="330" fill="#34d399" font-size="10">• Single: File .xlsx langsung</text>
    <text x="25" y="347" fill="#34d399" font-size="10">• Batch: File ZIP transkrip</text>
    <text x="25" y="364" fill="#94a3b8" font-size="10">• Simpan ke RiwayatGenerate</text>
  </g>

  <!-- Flow Arrows connecting the 4 steps -->
  <path d="M 240 310 L 270 310" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowB)"/>
  <path d="M 480 310 L 510 310" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrowB)"/>
  <path d="M 730 310 L 760 310" fill="none" stroke="#ec4899" stroke-width="3" marker-end="url(#arrowB)"/>

  <!-- FOOTER SUMMARY BAR -->
  <g transform="translate(30, 535)">
    <rect width="940" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="25" y="30" fill="#f8fafc" font-size="13" font-weight="700">CATATAN KHUSUS ENGINE GENERATE TRANSKRIP:</text>

    <circle cx="35" cy="55" r="4" fill="#38bdf8"/>
    <text x="50" y="59" fill="#cbd5e1" font-size="11">Neo Feeder diakses secara <tspan fill="#38bdf8" font-weight="700">read-only</tspan> tanpa mengubah database pusat PDDIKTI.</text>

    <circle cx="35" cy="78" r="4" fill="#c084fc"/>
    <text x="50" y="82" fill="#cbd5e1" font-size="11">Pemrosesan batch menerapkan jeda 0.3 detik antar NIM untuk kestabilan koneksi dan perlindungan beban server.</text>

    <circle cx="35" cy="101" r="4" fill="#34d399"/>
    <text x="50" y="105" fill="#cbd5e1" font-size="11">Dukungan pembatalan batch (Cancel Job) langsung dari halaman antarmuka web jika terjadi kekeliruan daftar input.</text>
  </g>
</svg>
