<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="portalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters for shadow -->
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title Bar -->
  <rect x="30" y="25" width="940" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow)"/>
  <rect x="30" y="25" width="940" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="50" y="62" fill="#ffffff" font-size="20" font-weight="700">DIAGRAM BLOK ARSITEKTUR &amp; ALUR PENDAFTARAN YUDISIUM</text>
  <text x="750" y="60" fill="#94a3b8" font-size="13" font-weight="500">Transkrip App • eCampuz Bot</text>

  <!-- BLOCK 1: OPERATOR & CLIENT UI -->
  <g transform="translate(30, 115)">
    <rect width="270" height="380" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#dropGlow)"/>
    <rect width="270" height="40" rx="14" fill="#1d4ed8" fill-opacity="0.25"/>
    <path d="M 0 14 Q 0 0 14 0 L 256 0 Q 270 0 270 14 L 270 40 L 0 40 Z" fill="#2563eb" fill-opacity="0.2"/>
    <circle cx="25" cy="20" r="7" fill="#38bdf8"/>
    <text x="42" y="26" fill="#60a5fa" font-size="14" font-weight="700">1. OPERATOR &amp; WEB UI</text>

    <!-- Sub-elements -->
    <rect x="15" y="55" width="240" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="78" fill="#e2e8f0" font-size="13" font-weight="600">Upload Roster NIM</text>
    <text x="25" y="98" fill="#94a3b8" font-size="11">Input file .xlsx / .xlsm / .csv</text>

    <rect x="15" y="125" width="240" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="148" fill="#e2e8f0" font-size="13" font-weight="600">Preview &amp; Verifikasi</text>
    <text x="25" y="168" fill="#94a3b8" font-size="11">Tabel daftar 20 NIM &amp; Total Mahasiswa</text>

    <rect x="15" y="195" width="240" height="72" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="25" y="218" fill="#fbbf24" font-size="13" font-weight="700">Guard Konfirmasi Keamanan</text>
    <text x="25" y="238" fill="#e2e8f0" font-size="11">• Centang Kewenangan Admin</text>
    <text x="25" y="254" fill="#e2e8f0" font-size="11">• Frasa: "DAFTAR YUDISIUM &lt;N&gt;"</text>

    <rect x="15" y="280" width="240" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="303" fill="#e2e8f0" font-size="13" font-weight="600">Console Log &amp; Monitoring</text>
    <text x="25" y="323" fill="#94a3b8" font-size="11">Progress bar, output log realtime,</text>
    <text x="25" y="341" fill="#38bdf8" font-size="11">Tombol Unduh CSV Laporan</text>
  </g>

  <!-- BLOCK 2: BACKEND CONTROLLER & JOBS -->
  <g transform="translate(360, 115)">
    <rect width="280" height="380" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#dropGlow)"/>
    <path d="M 0 14 Q 0 0 14 0 L 266 0 Q 280 0 280 14 L 280 40 L 0 40 Z" fill="#7c3aed" fill-opacity="0.25"/>
    <circle cx="25" cy="20" r="7" fill="#c084fc"/>
    <text x="42" y="26" fill="#c084fc" font-size="14" font-weight="700">2. BACKEND &amp; JOB ENGINE</text>

    <!-- Sub-elements -->
    <rect x="15" y="55" width="250" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="78" fill="#e2e8f0" font-size="13" font-weight="600">Access &amp; Security Guard</text>
    <text x="25" y="98" fill="#94a3b8" font-size="11">_is_local_operator_request (Lokal Only)</text>

    <rect x="15" y="125" width="250" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="148" fill="#e2e8f0" font-size="13" font-weight="600">Session &amp; Nonce Store</text>
    <text x="25" y="168" fill="#94a3b8" font-size="11">UUID upload token + rate limit (Max 50)</text>

    <rect x="15" y="195" width="250" height="65" rx="8" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="25" y="218" fill="#e2e8f0" font-size="13" font-weight="600">Job Thread Runner</text>
    <text x="25" y="238" fill="#94a3b8" font-size="11">Thread daemon terisolasi (JOB_LOCK)</text>
    <text x="25" y="252" fill="#94a3b8" font-size="11">Pausable via YUDI_JOB_EVENT</text>

    <rect x="15" y="272" width="250" height="88" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="295" fill="#e2e8f0" font-size="13" font-weight="600">Data Kelulusan Validator</text>
    <text x="25" y="315" fill="#94a3b8" font-size="11">Template BIFF 8 .xls (xlwt)</text>
    <text x="25" y="333" fill="#94a3b8" font-size="11">Preflight check 12 kolom resmi</text>
  </g>

  <!-- BLOCK 3: PLAYWRIGHT BOT & ECAMPUZ PORTAL -->
  <g transform="translate(700, 115)">
    <rect width="270" height="380" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#dropGlow)"/>
    <path d="M 0 14 Q 0 0 14 0 L 256 0 Q 270 0 270 14 L 270 40 L 0 40 Z" fill="#059669" fill-opacity="0.25"/>
    <circle cx="25" cy="20" r="7" fill="#34d399"/>
    <text x="42" y="26" fill="#34d399" font-size="14" font-weight="700">3. BOT OTOMASI &amp; ECAMPUZ</text>

    <!-- Sub-elements -->
    <rect x="15" y="55" width="240" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="78" fill="#e2e8f0" font-size="13" font-weight="600">Playwright Browser</text>
    <text x="25" y="98" fill="#94a3b8" font-size="11">Chromium headless / headful</text>

    <rect x="15" y="125" width="240" height="70" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="25" y="148" fill="#fb7185" font-size="13" font-weight="700">Manual Login Interceptor</text>
    <text x="25" y="168" fill="#94a3b8" font-size="11">Deteksi login page / CAPTCHA</text>
    <text x="25" y="184" fill="#fb7185" font-size="11">Jeda eksekusi untuk user</text>

    <rect x="15" y="205" width="240" height="70" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="25" y="228" fill="#e2e8f0" font-size="13" font-weight="600">Form Sequence Flow</text>
    <text x="25" y="248" fill="#94a3b8" font-size="11">RESET &rarr; Isi NIM &rarr; TAMPILKAN</text>
    <text x="25" y="264" fill="#94a3b8" font-size="11">Klik aksi &rarr; Tangkap konfirmasi</text>

    <rect x="15" y="285" width="240" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="308" fill="#e2e8f0" font-size="13" font-weight="600">eCampuz Portal Akademik</text>
    <text x="25" y="328" fill="#94a3b8" font-size="11">Modul Kelulusan / Yudisium</text>
    <text x="25" y="344" fill="#34d399" font-size="11">Status: Submitted / Failed</text>
  </g>

  <!-- BLOCK 4: PERSISTENCE / STORAGE (BOTTOM) -->
  <g transform="translate(30, 520)">
    <rect width="940" height="135" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#dropGlow)"/>
    <text x="25" y="35" fill="#f8fafc" font-size="14" font-weight="700">4. SISTEM PENYIMPANAN &amp; OUTPUT REKAPITULASI (PERSISTENCE LAYER)</text>

    <!-- 3 files cards -->
    <rect x="25" y="52" width="280" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="77" fill="#38bdf8" font-size="13" font-weight="600">State Checkpoint (.json)</text>
    <text x="40" y="97" fill="#94a3b8" font-size="11">SHA256 Fingerprint, status per NIM</text>
    <text x="40" y="108" fill="#64748b" font-size="10">Mencegah double-submission</text>

    <rect x="330" y="52" width="280" height="65" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="345" y="77" fill="#34d399" font-size="13" font-weight="600">Execution Log (.csv)</text>
    <text x="345" y="97" fill="#94a3b8" font-size="11">Timestamp, NIM, Status, Keterangan</text>
    <text x="345" y="108" fill="#64748b" font-size="10">Bukti resmi audit akademik</text>

    <rect x="635" y="52" width="280" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="650" y="77" fill="#fbbf24" font-size="13" font-weight="600">Template Kelulusan (.xls)</text>
    <text x="650" y="97" fill="#94a3b8" font-size="11">BIFF 8 Excel 12 Kolom eCampuz</text>
    <text x="650" y="108" fill="#64748b" font-size="10">Siap di-import ke Pengelolaan Yudisium</text>
  </g>

  <!-- Connective Arrows & Lines -->
  <!-- 1 to 2 -->
  <path d="M 300 230 L 350 230" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="306" y="222" fill="#38bdf8" font-size="10" font-weight="600">POST Upload</text>

  <!-- 2 to 3 -->
  <path d="M 640 230 L 690 230" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="643" y="222" fill="#c084fc" font-size="10" font-weight="600">Spawn Bot</text>

  <!-- 3 to 2 (Pause/Resume callback) -->
  <path d="M 690 280 L 640 280" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="642" y="295" fill="#fb7185" font-size="9" font-weight="600">Pause / Event</text>

  <!-- 3 to 4 (Bot logs state to storage) -->
  <path d="M 835 495 L 835 510 L 470 510 L 470 520" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 1 to 2 status polling -->
  <path d="M 350 330 L 300 330" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="308" y="345" fill="#38bdf8" font-size="9" font-weight="600">Polling Status</text>

</svg>
